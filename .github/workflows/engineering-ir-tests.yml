name: Engineering semantic model tests

on:
  pull_request:
    paths:
      - "backend/engine/**"
      - "backend/main.py"
      - "tests/**"
      - ".github/workflows/engineering-ir-tests.yml"
  push:
    branches:
      - main
      - engineering-semantic-model

jobs:
  engineering-ir:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip pydantic sympy
      - name: Run engineering semantic model tests
        run: python -m unittest discover -s tests -p "test_engineering_ir.py" -v
